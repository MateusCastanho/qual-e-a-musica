<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1119">
<title>Qual é a Música?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- O ?v= força o navegador a buscar a versão nova em vez da que está em
     cache. Ao mexer em style.css, app.js ou nos dados, incremente o número. -->
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>

<header class="topbar">
  <h1>Qual é a <br>Música<span class="accent">?</span></h1>
  <div class="rule"></div>
</header>

<main>

  <!-- ESCOLHA DE GÊNERO -->
  <section id="screen-genres" class="screen">
    <nav class="abas" role="tablist" aria-label="Modos de jogo">
      <button type="button" class="aba ativa" data-aba="hoje" role="tab" aria-selected="true">Hoje</button>
      <button type="button" class="aba" data-aba="desafios" role="tab" aria-selected="false">Desafios</button>
      <button type="button" class="aba" data-aba="livre" role="tab" aria-selected="false">Livre</button>
    </nav>

    <!-- HOJE -->
    <div class="painel" id="painel-hoje" role="tabpanel">
      <div id="daily-card" class="daily-card"></div>

      <section id="stats-panel" class="stats-panel hidden" aria-label="Suas estatísticas">
      <div class="rank-head">
        <div>
          <p class="stats-label">Patente</p>
          <p class="rank-name" id="rank-name"></p>
        </div>
        <p class="rank-points"><span id="rank-points">0</span> pts</p>
      </div>

      <div class="rank-track">
        <div class="rank-fill" id="rank-fill"></div>
      </div>
      <p class="rank-next" id="rank-next"></p>

      <div class="stats-grid">
        <div class="stat-cell"><b><span id="st-wins">0</span><i>/<span id="st-rounds">0</span></i></b><span>acertos</span></div>
        <div class="stat-cell"><b id="st-rate">0%</b><span>aproveitamento</span></div>
        <div class="stat-cell"><b id="st-best">0</b><span>melhor sequência</span></div>
        <div class="stat-cell"><b id="st-fav">—</b><span>melhor gênero</span></div>
      </div>

      <p class="stats-label">Acertos por trecho</p>
      <div class="dist" id="dist"></div>

        <button type="button" id="btn-reset-stats" class="link-btn reset-btn">Zerar estatísticas</button>
      </section>
    </div>

    <!-- DESAFIOS -->
    <div class="painel hidden" id="painel-desafios" role="tabpanel">
      <p class="subtitle">Dez músicas de um gênero numa década. No fim sai o placar, para mandar no grupo.</p>
      <div id="desafio-grid" class="desafio-lista"></div>
      <p class="secao-label hidden" id="desafios-label"></p>
    </div>

    <!-- LIVRE -->
    <div class="painel hidden" id="painel-livre" role="tabpanel">
      <p class="subtitle">Sem fim: escolha e vá tocando até cansar.</p>

      <div class="modo">
        <button type="button" id="btn-hits" class="modo-btn" aria-pressed="true">Só os hits</button>
        <span class="modo-hint" id="hits-hint"></span>
      </div>

      <div id="genre-grid" class="genre-grid"></div>

      <p class="secao-label">Por década</p>
      <div id="decade-grid" class="genre-grid"></div>
    </div>
  </section>

  <!-- JOGO -->
  <section id="screen-game" class="screen hidden">
    <button id="btn-change-genre" class="link-btn">← Trocar gênero</button>

    <div class="player-card">
      <button id="btn-play-snippet" class="play-btn">
        <span id="play-btn-label">Tocar trecho</span> · <span id="current-duration">0.5</span>s
      </button>

      <div class="tape">
        <div class="tape-track" id="tape-track">
          <div class="tape-unlocked" id="tape-unlocked"></div>
          <div class="tape-fill" id="tape-fill"></div>
        </div>
        <div class="tape-scale" id="tape-scale"></div>
      </div>
    </div>

    <form id="guess-form" class="guess-form" autocomplete="off">
      <div class="guess-input-wrap">
        <label class="sr-only" for="guess-input">Seu palpite</label>
        <input
          id="guess-input"
          type="text"
          placeholder="Nome da música ou do artista…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="false"
          aria-autocomplete="list"
          aria-controls="suggestions-box"
        >
        <div id="suggestions-box" class="suggestions-box hidden" role="listbox" aria-label="Sugestões de músicas"></div>
      </div>
      <button type="submit" id="btn-guess">Chutar</button>
      <button type="button" id="btn-skip">Pular</button>
    </form>

    <div class="history-list" id="history-list" aria-live="polite"></div>

    <div id="reveal-card" class="reveal-card hidden" aria-live="polite">
      <p class="reveal-label" id="reveal-label">A música era</p>
      <p id="reveal-text"></p>
      <p id="reveal-sub" class="reveal-sub hidden"></p>
      <div id="desafio-stats" class="desafio-stats hidden"></div>
      <button id="btn-next-song" class="play-btn">Próxima música</button>
      <button type="button" id="btn-share-desafio" class="modo-btn share-desafio hidden">Compartilhar</button>
    </div>

  </section>

</main>

<script src="data/songs.js?v=12"></script>
<script src="data/decoys.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
